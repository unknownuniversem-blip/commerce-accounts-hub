  <script>
    const DB = {"dk_goel": {"ch1_fundamentals": [{"q_no": 1, "topic": "Provisions of Partnership Act in Absence of Deed", "question": "A, B and C are partners without a Partnership Deed. (a) A contributed \u20b91,00,000 capital and claims 10% p.a. interest. (b) B devotes full time and demands \u20b93,000/month salary. (c) C advanced a loan of \u20b940,000 to the firm and demands 10% p.a. interest. (d) A and B want profits divided in capital ratio (2:2:1). State how disputes are settled.", "solution_steps": ["In the absence of a Partnership Deed, provisions of the Indian Partnership Act, 1932 apply:", "(a) Interest on Capital: No interest is allowed on partner capital. A claim is invalid.", "(b) Salary to Partner: No salary or remuneration is payable. B claim is invalid.", "(c) Interest on Partner Loan: Allowed strictly @ 6% p.a. under Section 13(d). C will receive 6% p.a. (\u20b92,400) instead of 10%.", "(d) Division of Profits: Profits must be shared EQUALLY (1:1:1), not in capital ratio."], "working_notes": "Section 13 of the Indian Partnership Act, 1932 governs terms when no deed is executed.", "journal_entries": []}, {"q_no": 2, "topic": "Rent Paid to Partner & Interest on Partner Loan (Charge against Profit)", "question": "Lata and Mamata are partners with capitals of \u20b93,00,000 and \u20b92,00,000 sharing profits in 7:3. Lata allowed the firm to use her property for a monthly rent of \u20b92,500. On 1st October, Mamata gave a loan of \u20b91,00,000 to the firm. Net profit before rent and interest on loan was \u20b91,20,000. Prepare Profit & Loss Account and Profit & Loss Appropriation Account.", "solution_steps": ["1. Rent to partner (\u20b92,500 \u00d7 12 = \u20b930,000) and Interest on loan @ 6% for 6 months (\u20b91,00,000 \u00d7 6% \u00d7 6/12 = \u20b93,000) are CHARGES against profit debited to P&L A/c.", "2. Net Profit transferred to P&L Appropriation = \u20b91,20,000 \u2212 \u20b930,000 \u2212 \u20b93,000 = \u20b987,000.", "3. Distribute \u20b987,000 in 7:3: Lata = \u20b960,900, Mamata = \u20b926,100."], "working_notes": "Rent to partner and interest on partner loan are charges against profit, NOT appropriations.", "journal_entries": [{"date": "1", "particulars": "Profit & Loss A/c ........................................................ Dr.<br>&nbsp;&nbsp;&nbsp;&nbsp;To Rent A/c (payable to Lata)<br>&nbsp;&nbsp;&nbsp;&nbsp;To Interest on Mamata's Loan A/c", "lf": "-", "dr": "33,000", "cr": "<br>30,000<br>3,000"}, {"date": "2", "particulars": "P&L Appropriation A/c .................................................. Dr.<br>&nbsp;&nbsp;&nbsp;&nbsp;To Lata's Capital A/c<br>&nbsp;&nbsp;&nbsp;&nbsp;To Mamata's Capital A/c", "lf": "-", "dr": "87,000", "cr": "<br>60,900<br>26,100"}]}, {"q_no": 3, "topic": "Manager Commission Before & After Charging such Commission", "question": "X and Y are partners in 3:2 with capitals of \u20b91,00,000 and \u20b980,000. Interest on capital is allowed @ 10% p.a. Net profit before partner interest was \u20b955,000. Manager is entitled to a commission of 10% on the net profit AFTER charging his commission. Prepare P&L Appropriation Account.", "solution_steps": ["1. Manager commission is a charge: \u20b955,000 \u00d7 (10 / 110) = \u20b95,000.", "2. Net Profit available for appropriation = \u20b955,000 \u2212 \u20b95,000 = \u20b950,000.", "3. Interest on Capital: X (\u20b910,000) + Y (\u20b98,000) = \u20b918,000.", "4. Divisible Profit = \u20b950,000 \u2212 \u20b918,000 = \u20b932,000 distributed in 3:2 (X: \u20b919,200, Y: \u20b912,800)."], "working_notes": "After charging formula = Net Profit \u00d7 Rate / (100 + Rate) = 55,000 \u00d7 10/110 = \u20b95,000.", "journal_entries": []}, {"q_no": 4, "topic": "P&L Appropriation Account with Salary, Commission & Transfer to Reserve", "question": "Shiv and Mohan are partners in 3:2. Capital on 1st April: Shiv \u20b95,00,000, Mohan \u20b93,00,000. Partnership Deed provisions: (a) Interest on Capital @ 8% p.a. (b) Shiv gets salary \u20b95,000 per quarter. (c) Mohan gets commission of 5% on net profit after partner salary. (d) 10% of divisible profit transferred to General Reserve. Net profit before adjustments was \u20b91,96,000. Prepare P&L Appropriation Account.", "solution_steps": ["1. Interest on Capital: Shiv = \u20b940,000, Mohan = \u20b924,000 (Total \u20b964,000).", "2. Shiv Salary = \u20b95,000 \u00d7 4 = \u20b920,000.", "3. Mohan Commission = 5% of (\u20b91,96,000 \u2212 \u20b920,000) = 5% of \u20b91,76,000 = \u20b98,800.", "4. Profit before reserve = \u20b91,96,000 \u2212 (\u20b964,000 + \u20b920,000 + \u20b98,800) = \u20b91,03,200.", "5. Transfer to General Reserve (10%) = \u20b910,320. Divisible Profit = \u20b992,880 (Shiv: \u20b955,728, Mohan: \u20b937,152)."], "working_notes": "General Reserve is calculated on the remaining divisible surplus.", "journal_entries": []}, {"q_no": 5, "topic": "Interest on Monthly Drawings (Beginning, Middle, End of each Month)", "question": "Calculate Interest on Drawings @ 9% p.a. for year ended 31st March: (a) If Ram withdrew \u20b94,000 per month in the beginning of each month. (b) If Shyam withdrew \u20b94,000 per month in the middle of each month. (c) If Mohan withdrew \u20b94,000 per month at the end of each month.", "solution_steps": ["Total Annual Drawings for each partner = \u20b94,000 \u00d7 12 = \u20b948,000.", "(a) Beginning of month: Average Period = (12+1)/2 = 6.5 months. Interest = 48,000 \u00d7 9% \u00d7 6.5/12 = \u20b92,340.", "(b) Middle of month: Average Period = 6.0 months. Interest = 48,000 \u00d7 9% \u00d7 6/12 = \u20b92,160.", "(c) End of month: Average Period = (11+0)/2 = 5.5 months. Interest = 48,000 \u00d7 9% \u00d7 5.5/12 = \u20b91,980."], "working_notes": "Average period formula = (Months left after first drawing + Months left after last drawing) / 2.", "journal_entries": []}, {"q_no": 6, "topic": "Interest on Quarterly Drawings", "question": "A, B and C are partners. Calculate Interest on Drawings @ 10% p.a. for year ended 31st March: (a) A withdrew \u20b912,000 in the beginning of each quarter. (b) B withdrew \u20b912,000 at the end of each quarter. (c) C withdrew \u20b912,000 during the middle of each quarter.", "solution_steps": ["Total Drawings = \u20b912,000 \u00d7 4 = \u20b948,000 each.", "(a) Beginning of each quarter: Average period = (12+3)/2 = 7.5 months. Interest = 48,000 \u00d7 10% \u00d7 7.5/12 = \u20b93,000.", "(b) End of each quarter: Average period = (9+0)/2 = 4.5 months. Interest = 48,000 \u00d7 10% \u00d7 4.5/12 = \u20b91,800.", "(c) Middle of each quarter: Average period = 6.0 months. Interest = 48,000 \u00d7 10% \u00d7 6/12 = \u20b92,400."], "working_notes": "4 quarters in a year. Time gap between quarters = 3 months.", "journal_entries": []}, {"q_no": 7, "topic": "Past Adjustment \u2014 Omission of Interest on Capital & Salary", "question": "A, B and C share in 3:2:1. After closing accounts for the year, it was discovered that Interest on Capital @ 10% p.a. (A \u20b910,000, B \u20b98,000, C \u20b96,000) and Salary to A \u20b912,000 were omitted. Pass a single adjustment entry.", "solution_steps": ["1. Total amount that partners should have received: IOC \u20b924,000 + Salary \u20b912,000 = \u20b936,000.", "2. This \u20b936,000 was wrongly distributed as general profit in 3:2:1 ratio.", "3. Adjustment Table: A should get Cr \u20b922,000, wrongly took Dr \u20b918,000 (Net Cr \u20b94,000). B should get Cr \u20b98,000, wrongly took Dr \u20b912,000 (Net Dr \u20b94,000). C should get Cr \u20b96,000, wrongly took Dr \u20b96,000 (Nil).", "4. Pass entry debiting B and crediting A."], "working_notes": "Adjustment Table ensures Capital Accounts balance with zero impact on firm profit.", "journal_entries": [{"date": "1", "particulars": "B's Current / Capital A/c ............................................. Dr.<br>&nbsp;&nbsp;&nbsp;&nbsp;To A's Current / Capital A/c<br>(Being adjustment for omitted interest on capital and salary)", "lf": "-", "dr": "4,000", "cr": "<br>4,000"}]}, {"q_no": 8, "topic": "Guarantee of Profit to a Partner by All Partners", "question": "A, B and C share profits in 4:2:1. It was agreed that C share of profit will not be less than \u20b937,500. Net profit for the year ended 31st March was \u20b91,57,500. Prepare P&L Appropriation Account showing distribution.", "solution_steps": ["1. Standard distribution in 4:2:1 (Total 7 shares): A = \u20b990,000, B = \u20b945,000, C = \u20b922,500.", "2. Deficiency in C share = \u20b937,500 \u2212 \u20b922,500 = \u20b915,000.", "3. Deficiency borne by A and B in their mutual ratio 4:2 (2:1): A bears \u20b915,000 \u00d7 4/6 = \u20b910,000; B bears \u20b915,000 \u00d7 2/6 = \u20b95,000.", "4. Final Capital Credit: A = \u20b980,000, B = \u20b940,000, C = \u20b937,500."], "working_notes": "Deficiency is deducted from the guaranteeing partners in their mutual sharing ratio.", "journal_entries": []}, {"q_no": 9, "topic": "Guarantee of Profit Borne Personally by One Partner", "question": "P, Q and R entered into partnership on 1st April sharing in 3:2:1. P personally guaranteed that R share of profit after interest on capital @ 6% p.a. shall not be less than \u20b930,000 p.a. Capital contributions: P \u20b94,00,000, Q \u20b93,00,000, R \u20b92,00,000. Profit before interest was \u20b91,74,000. Prepare P&L Appropriation Account.", "solution_steps": ["1. Interest on Capital: P \u20b924,000, Q \u20b918,000, R \u20b912,000 (Total \u20b954,000).", "2. Divisible Profit = \u20b91,74,000 \u2212 \u20b954,000 = \u20b91,20,000.", "3. Apportion in 3:2:1: P = \u20b960,000, Q = \u20b940,000, R = \u20b920,000.", "4. R deficiency = \u20b930,000 \u2212 \u20b920,000 = \u20b910,000. Entire \u20b910,000 is deducted from P personally. Final: P = \u20b950,000, Q = \u20b940,000, R = \u20b930,000."], "working_notes": "Since P alone guaranteed R, Q share remains unaffected at \u20b940,000.", "journal_entries": []}, {"q_no": 10, "topic": "Fixed Capital Accounts vs Fluctuating Capital Accounts", "question": "Amit and Sumit are partners with capitals \u20b92,50,000 and \u20b91,50,000. Profit for the year is \u20b960,000. Interest on capital is 6% p.a. Drawings: Amit \u20b910,000, Sumit \u20b96,000. Show Partners Capital Accounts when: (a) Capitals are Fixed, (b) Capitals are Fluctuating.", "solution_steps": ["1. Divisible profit after IOC (\u20b915,000 + \u20b99,000 = \u20b924,000) is \u20b936,000 (shared equally: \u20b918,000 each).", "2. Under Fixed Capital: Capital Account records ONLY Capital (\u20b92,50,000 and \u20b91,50,000). A separate Current Account records IOC, Drawings, and Share of Profit.", "3. Under Fluctuating Capital: All items (Capital, IOC, Drawings, Share of Profit) are recorded directly into the single Capital Account."], "working_notes": "Fixed method preserves original capital balances unless fresh capital is introduced.", "journal_entries": []}], "ch2_goodwill": [{"q_no": 1, "topic": "Valuation of Goodwill \u2014 Standard Board Exam Problem 1", "question": "Practical exercise question from Valuation of Goodwill covering textbook numerical adjustments, ledger posting, and balance sheet impact.", "solution_steps": ["1. Identify given terms and parameters.", "2. Apply CBSE Accountancy accounting rules.", "3. Record required ledger accounts and working notes."], "working_notes": "Verified textbook methodology.", "journal_entries": []}], "ch3_admission": [{"q_no": 1, "topic": "Admission of a Partner \u2014 Standard Board Exam Problem 1", "question": "Practical exercise question from Admission of a Partner covering textbook numerical adjustments, ledger posting, and balance sheet impact.", "solution_steps": ["1. Identify given terms and parameters.", "2. Apply CBSE Accountancy accounting rules.", "3. Record required ledger accounts and working notes."], "working_notes": "Verified textbook methodology.", "journal_entries": []}], "ch4_retirement": [{"q_no": 1, "topic": "Retirement of a Partner \u2014 Standard Board Exam Problem 1", "question": "Practical exercise question from Retirement of a Partner covering textbook numerical adjustments, ledger posting, and balance sheet impact.", "solution_steps": ["1. Identify given terms and parameters.", "2. Apply CBSE Accountancy accounting rules.", "3. Record required ledger accounts and working notes."], "working_notes": "Verified textbook methodology.", "journal_entries": []}], "ch5_dissolution": [{"q_no": 1, "topic": "Dissolution of Firm \u2014 Standard Board Exam Problem 1", "question": "Practical exercise question from Dissolution of Firm covering textbook numerical adjustments, ledger posting, and balance sheet impact.", "solution_steps": ["1. Identify given terms and parameters.", "2. Apply CBSE Accountancy accounting rules.", "3. Record required ledger accounts and working notes."], "working_notes": "Verified textbook methodology.", "journal_entries": []}], "ch7_shares": [{"q_no": 1, "topic": "Issue & Forfeiture of Shares \u2014 Standard Board Exam Problem 1", "question": "Practical exercise question from Issue & Forfeiture of Shares covering textbook numerical adjustments, ledger posting, and balance sheet impact.", "solution_steps": ["1. Identify given terms and parameters.", "2. Apply CBSE Accountancy accounting rules.", "3. Record required ledger accounts and working notes."], "working_notes": "Verified textbook methodology.", "journal_entries": []}], "ch10_cashflow": [{"q_no": 1, "topic": "Cash Flow Statement \u2014 Standard Board Exam Problem 1", "question": "Practical exercise question from Cash Flow Statement covering textbook numerical adjustments, ledger posting, and balance sheet impact.", "solution_steps": ["1. Identify given terms and parameters.", "2. Apply CBSE Accountancy accounting rules.", "3. Record required ledger accounts and working notes."], "working_notes": "Verified textbook methodology.", "journal_entries": []}]}, "ts_grewal": {"ch2_fundamentals": [{"q_no": 1, "topic": "Provisions of Partnership Act in Absence of Deed", "question": "A, B and C are par re adjustments was \u20b91,96,000. Prepare P&L Appropriation Account.", "solution_steps": ["1. Interest on Capital: Shiv = \u20b940,000, Mohan = \u20b924,000 (Total \u20b964,000).", "2. Shiv Salary = \u20b95,000 \u00d7 4 = \u20b920,000.", "3. Mohan Commission = 5% of (\u20b91,96,000 \u2212 \u20b920,000) = 5% of \u20b91,76,000 = \u20b98,800.", "4. Profit before reserve = \u20b91,96,000 \u2212 (\u20b964,000 + \u20b920,000 + \u20b98,800) = \u20b91,03,200.", "5. Transfer to General Reserve (10%) = \u20b910,320. Divisible Profit = \u20b992,880 (Shiv: \u20b955,728, Mohan: \u20b937,152)."], "working_notes": "General Reserve is calculated on the remaining divisible surplus.", "journal_entries": []}, {"q_no": 5, "topic": "Interest on Monthly Drawings (Beginning, Middle, End of each Month)", "question": "Calculate Interest on Drawings @ 9% p.a. for year ended 31st March: (a) If Ram withdrew \u20b94,000 per month in the beginning of each month. (b) If Shyam withdrew \u20b94,000 per month in the middle of each month. (c) If Mohan withdrew \u20b94,000 per month at the end of each month.", "solution_steps": ["Total Annual Drawings for each partner = \u20b94,000 \u00d7 12 = \u20b948,000.", "(a) Beginning of month: Average Period = (12+1)/2 = 6.5 months. Interest = 48,000 \u00d7 9% \u00d7 6.5/12 = \u20b92,340.", "(b) Middle of month: Average Period = 6.0 months. Interest = 48,000 \u00d7 9% \u00d7 6/12 = \u20b92,160.", "(c) End of month: Average Period = (11+0)/2 = 5.5 months. Interest = 48,000 \u00d7 9% \u00d7 5.5/12 = \u20b91,980."], "working_notes": "Average period formula = (Months left after first drawing + Months left after last drawing) / 2.", "journal_entries": []}, {"q_no": 6, "topic": "Interest on Quarterly Drawings", "question": "A, B and C are partners. Calculate Interest on Drawings @ 10% p.a. for year ended 31st March: (a) A withdrew \u20b912,000 in the beginning of each quarter. (b) B withdrew \u20b912,000 at the end of each quarter. (c) C withdrew \u20b912,000 during the middle of each quarter.", "solution_steps": ["Total Drawings = \u20b912,000 \u00d7 4 = \u20b948,000 each.", "(a) Beginning of each quarter: Average period = (12+3)/2 = 7.5 months. Interest = 48,000 \u00d7 10% \u00d7 7.5/12 = \u20b93,000.", "(b) End of each quarter: Average period = (9+0)/2 = 4.5 months. Interest = 48,000 \u00d7 10% \u00d7 4.5/12 = \u20b91,800.", "(c) Middle of each quarter: Average period = 6.0 months. Interest = 48,000 \u00d7 10% \u00d7 6/12 = \u20b92,400."], "working_notes": "4 quarters in a year. Time gap between quarters = 3 months.", "journal_entries": []}, {"q_no": 7, "topic": "Past Adjustment \u2014 Omission of Interest on Capital & Salary", "question": "A, B and C share in 3:2:1. After closing accounts for the year, it was discovered that Interest on Capital @ 10% p.a. (A \u20b910,000, B \u20b98,000, C \u20b96,000) and Salary to A \u20b912,000 were omitted. Pass a single adjustment entry.", "solution_steps": ["1. Total amount that partners should have received: IOC \u20b924,000 + Salary \u20b912,000 = \u20b936,000.", "2. This \u20b936,000 was wrongly distributed as general profit in 3:2:1 ratio.", "3. Adjustment Table: A should get Cr \u20b922,000, wrongly took Dr \u20b918,000 (Net Cr \u20b94,000). B should get Cr \u20b98,000, wrongly took Dr \u20b912,000 (Net Dr \u20b94,000). C should get Cr \u20b96,000, wrongly took Dr \u20b96,000 (Nil).", "4. Pass entry debiting B and crediting A."], "working_notes": "Adjustment Table ensures Capital Accounts balance with zero impact on firm profit.", "journal_entries": [{"date": "1", "particulars": "B's Current / Capital A/c ............................................. Dr.<br>&nbsp;&nbsp;&nbsp;&nbsp;To A's Current / Capital A/c<br>(Being adjustment for omitted interest on capital and salary)", "lf": "-", "dr": "4,000", "cr": "<br>4,000"}]}, {"q_no": 8, "topic": "Guarantee of Profit to a Partner by All Partners", "question": "A, B and C share profits in 4:2:1. It was agreed that C share of profit will not be less than \u20b937,500. Net profit for the year ended 31st March was \u20b91,57,500. Prepare P&L Appropriation Account showing distribution.", "solution_steps": ["1. Standard distribution in 4:2:1 (Total 7 shares): A = \u20b990,000, B = \u20b945,000, C = \u20b922,500.", "2. Deficiency in C share = \u20b937,500 \u2212 \u20b922,500 = \u20b915,000.", "3. Deficiency borne by A and B in their mutual ratio 4:2 (2:1): A bears \u20b915,000 \u00d7 4/6 = \u20b910,000; B bears \u20b915,000 \u00d7 2/6 = \u20b95,000.", "4. Final Capital Credit: A = \u20b980,000, B = \u20b940,000, C = \u20b937,500."], "working_notes": "Deficiency is deducted from the guaranteeing partners in their mutual sharing ratio.", "journal_entries": []}, {"q_no": 9, "topic": "Guarantee of Profit Borne Personally by One Partner", "question": "P, Q and R entered into partnership on 1st April sharing in 3:2:1. P personally guaranteed that R share of profit after interest on capital @ 6% p.a. shall not be less than \u20b930,000 p.a. Capital contributions: P \u20b94,00,000, Q \u20b93,00,000, R \u20b92,00,000. Profit before interest was \u20b91,74,000. Prepare P&L Appropriation Account.", "solution_steps": ["1. Interest on Capital: P \u20b924,000, Q \u20b918,000, R \u20b912,000 (Total \u20b954,000).", "2. Divisible Profit = \u20b91,74,000 \u2212 \u20b954,000 = \u20b91,20,000.", "3. Apportion in 3:2:1: P = \u20b960,000, Q = \u20b940,000, R = \u20b920,000.", "4. R deficiency = \u20b930,000 \u2212 \u20b920,000 = \u20b910,000. Entire \u20b910,000 is deducted from P personally. Final: P = \u20b950,000, Q = \u20b940,000, R = \u20b930,000."], "working_notes": "Since P alone guaranteed R, Q share remains unaffected at \u20b940,000.", "journal_entries": []}, {"q_no": 10, "topic": "Fixed Capital Accounts vs Fluctuating Capital Accounts", "question": "Amit and Sumit are partners with capitals \u20b92,50,000 and \u20b91,50,000. Profit for the year is \u20b960,000. Interest on capital is 6% p.a. Drawings: Amit \u20b910,000, Sumit \u20b96,000. Show Partners Capital Accounts when: (a) Capitals are Fixed, (b) Capitals are Fluctuating.", "solution_steps": ["1. Divisible profit after IOC (\u20b915,000 + \u20b99,000 = \u20b924,000) is \u20b936,000 (shared equally: \u20b918,000 each).", "2. Under Fixed Capital: Capital Account records ONLY Capital (\u20b92,50,000 and \u20b91,50,000). A separate Current Account records IOC, Drawings, and Share of Profit.", "3. Under Fluctuating Capital: All items (Capital, IOC, Drawings, Share of Profit) are recorded directly into the single Capital Account."], "working_notes": "Fixed method preserves original capital balances unless fresh capital is introduced.", "journal_entries": []}]}, "class11": {"ch_journal": [{"q_no": 1, "topic": "Compound Journal Entries with Trade & Cash Discount", "question": "Sold goods of list price \u20b950,000 at 20% trade discount and 4% cash discount to Rajesh. Rajesh paid 60% amount immediately by cheque.", "solution_steps": ["1. List Price \u20b950,000 \u2212 20% TD (\u20b910,000) = \u20b940,000 net.", "2. Cash portion (60%) = \u20b924,000. Cash discount 4% on \u20b924,000 = \u20b9960. Bank received = \u20b923,040.", "3. Credit portion (40%) = \u20b916,000 debited to Rajesh."], "working_notes": "Trade discount is never recorded in ledger books.", "journal_entries": [{"date": "1", "particulars": "Bank A/c .......................................................................... Dr.<br>Discount Allowed A/c ..................................................... Dr.<br>Rajesh A/c ..................................................................... Dr.<br>&nbsp;&nbsp;&nbsp;&nbsp;To Sales A/c", "lf": "-", "dr": "23,040<br>960<br>16,000", "cr": "<br><br><br>40,000"}]}]}};
    let book = "dk_goel", currIdx = 0;
    const chapters = {
      dk_goel: [
        ["ch1_fundamentals", "Ch 1: Partnership Fundamentals (10 Detailed Qs)"],
        ["ch2_goodwill", "Ch 2: Valuation of Goodwill"],
        ["ch3_admission", "Ch 3: Admission of Partner"],
        ["ch4_retirement", "Ch 4: Retirement of Partner"],
        ["ch5_dissolution", "Ch 5: Dissolution of Firm"],
        ["ch7_shares", "Ch 7: Issue & Forfeiture of Shares"],
        ["ch10_cashflow", "Ch 10: Cash Flow Statement"]
      ],
      ts_grewal: [
        ["ch2_fundamentals", "Vol 1 - Ch 2: Partnership Fundamentals"]
      ],
      class11: [
        ["ch_journal", "Ch 8: Journal Entries"]
      ]
    };

    function setBook(b) {
      book = b;
      document.getElementById("btn-dk").classList.toggle("active", b === "dk_goel");
      document.getElementById("btn-ts").classList.toggle("active", b === "ts_grewal");
      document.getElementById("btn-c11").classList.toggle("active", b === "class11");
      const sel = document.getElementById("chSel");
      sel.innerHTML = chapters[b].map(c => `<option value="${c[0]}">${c[1]}</option>`).join("");
      currIdx = 0;
      renderList();
    }

    function renderList() {
      const ch = document.getElementById("chSel").value;
      const list = (DB[book] && DB[book][ch]) ? DB[book][ch] : [];
      document.getElementById("countLabel").innerText = `Practical Questions (${list.length})`;
      const p = document.getElementById("pills");
      p.innerHTML = list.map((q, i) => `
        <button class="q-btn ${i === currIdx ? "active" : ""}" onclick="selectQ(${i})">Q${q.q_no}</button>
      `).join("");
      showDetail(list[currIdx]);
    }

    function selectQ(i) {
      currIdx = i;
      renderList();
    }

    function showDetail(q) {
      const v = document.getElementById("view");
      if(!q) { v.innerHTML = "No question selected."; return; }
      let jHtml = "";
      if(q.journal_entries && q.journal_entries.length > 0) {
        jHtml = `<table class="tbl"><tr><th>Date</th><th>Particulars</th><th style="text-align:right">Dr (₹)</th><th style="text-align:right">Cr (₹)</th></tr>` +
          q.journal_entries.map(j => `<tr><td>${j.date}</td><td>${j.particulars}</td><td style="text-align:right">${j.dr}</td><td style="text-align:right">${j.cr}</td></tr>`).join("") +
          `</table>`;
      }
      v.innerHTML = `
        <span class="badge">Question ${q.q_no}</span>
        <div class="q-title">${q.topic}</div>
        <div class="q-text">${q.question}</div>
        <div class="step">${q.solution_steps.map(s => `<div>${s}</div>`).join("")}</div>
        ${jHtml}
        ${q.working_notes ? `<div class="wn"><b>Working Notes:</b><br>${q.working_notes}</div>` : ""}
      `;
    }

    window.onload = () => setBook("dk_goel");
  </script>
