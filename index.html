      ts_grewal: [
        { key: "ch2_fundamentals", name: "Vol 1 - Ch 2: Partnership Fundamentals (20 Qs)" },
        { key: "ch9_ratios", name: "Vol 3 - Ch 4: Accounting Ratios (15 Qs)" }
      ],
      class11: [
        { key: "ch_journal", name: "Ch 8: Journal & Compound Entries (20 Qs)" }
      ]
    };

    function switchBook(book) {
      currentBook = book;
      document.getElementById("tabDk").classList.toggle("active", book === "dk_goel");
      document.getElementById("tabTs").classList.toggle("active", book === "ts_grewal");
      document.getElementById("tabC11").classList.toggle("active", book === "class11");
      
      const sel = document.getElementById("chapterSelect");
      sel.innerHTML = chapters[book].map(c => `<option value="${c.key}">${c.name}</option>`).join("");
      activeIdx = 0;
      renderQuestions();
    }

    function renderQuestions() {
      const ch = document.getElementById("chapterSelect").value;
      const qList = (db[currentBook] && db[currentBook][ch]) ? db[currentBook][ch] : [];
      document.getElementById("sideTitle").innerText = `Practical Questions (${qList.length} Total)`;

      const pills = document.getElementById("pillsContainer");
      pills.innerHTML = qList.map((q, i) => `
        <button class="q-pill ${i === activeIdx ? "active" : ""}" onclick="selectQ(${i})">Q${q.q_no}</button>
      `).join("");

      renderDetail(qList[activeIdx]);
    }

    function selectQ(i) {
      activeIdx = i;
      renderQuestions();
    }

    function renderDetail(item) {
      const c = document.getElementById("detailContainer");
      if (!item) { c.innerHTML = "<p>Select a question.</p>"; return; }

      let jHtml = "";
      if (item.journal_entries && item.journal_entries.length > 0) {
        jHtml = `<h4 style="margin: 12px 0 6px;">Journal Entries:</h4>
        <table class="table">
          <tr><th>Date</th><th>Particulars</th><th style="text-align:right;">Dr (₹)</th><th style="text-align:right;">Cr (₹)</th></tr>
          ${item.journal_entries.map(j => `<tr><td>${j.date}</td><td>${j.particulars}</td><td style="text-align:right;">${j.dr}</td><td style="text-align:right;">${j.cr}</td></tr>`).join("")}
        </table>`;
      }

      let lHtml = "";
      if (item.ledger) {
        lHtml = `<h4 style="margin: 12px 0 6px;">${item.ledger.title}:</h4>
        <table class="table">
          <tr><th>Dr Particulars</th><th style="text-align:right;">Amount (₹)</th><th>Cr Particulars</th><th style="text-align:right;">Amount (₹)</th></tr>
          <tr>
            <td>${item.ledger.debit.map(d => `${d.particulars}<br>`).join("")}</td>
            <td style="text-align:right;">${item.ledger.debit.map(d => `${d.amount}<br>`).join("")}</td>
            <td>${item.ledger.credit.map(cr => `${cr.particulars}<br>`).join("")}</td>
            <td style="text-align:right;">${item.ledger.credit.map(cr => `${cr.amount}<br>`).join("")}</td>
          </tr>
          <tr style="font-weight:bold; background:#f1f5f9;">
            <td>Total</td><td style="text-align:right;">₹ ${item.ledger.total}</td>
            <td>Total</td><td style="text-align:right;">₹ ${item.ledger.total}</td>
          </tr>
        </table>`;
      }

      c.innerHTML = `
        <span class="q-badge">Practical Question ${item.q_no}</span>
        <h2 class="q-title">${item.topic}</h2>
        <div class="q-box">${item.question}</div>
        <div>${item.solution_steps.map(s => `<div>${s}</div>`).join("")}</div>
        ${jHtml}
        ${lHtml}
        ${item.working_notes ? `<div class="wn-box"><b>📝 Working Notes:</b><br>${item.working_notes}</div>` : ""}
      `;
    }

    document.addEventListener("DOMContentLoaded", () => switchBook("dk_goel"));
  </script>
</body>
</html>
